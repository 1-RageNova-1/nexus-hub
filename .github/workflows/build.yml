name: Build Nexus

on:
  push:
    branches:
      - main
      - feature/nexus-workspace-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86_64 bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Debian package
        run: cargo tauri build --bundles deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Windows installers
        run: cargo tauri build --bundles nsis,msi
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: cargo tauri android init --ci
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Android APK
        run: cargo tauri android build --apk --target aarch64
      - name: Generate Android signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/nexus-debug.keystore"
          STORE_PASSWORD="nexus-debug-password"
          KEY_ALIAS="nexus"
          KEY_PASSWORD="nexus-debug-password"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nexus Hub,O=Nexus,C=FR"

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*signed*' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Android APK not found."
            find src-tauri/gen/android/app/build/outputs/apk -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="$RUNNER_TEMP/nexus-aligned.apk"
          SIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/Nexus-0.1.1-android-arm64.apk"
          mkdir -p "$(dirname "$SIGNED_APK")"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          echo "Signed APK: $SIGNED_APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/Nexus-0.1.1-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
