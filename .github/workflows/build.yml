name: Build Nexus

on:
  push:
    branches:
      - main
      - feature/nexus-workspace-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86_64 bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Debian package
        run: cargo tauri build --bundles deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
