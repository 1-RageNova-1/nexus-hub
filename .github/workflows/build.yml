name: Build Nexus

on:
  push:
    branches:
      - main
      - feature/nexus-workspace-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86_64 bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Debian package
        run: cargo tauri build --bundles deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Windows installers
        run: cargo tauri build --bundles nsis,msi
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: cargo tauri android init --ci
      - name: Prefer Google-hosted Maven Central mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("src-tauri/gen/android")
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          changed = 0
          for path in root.rglob("*"):
              if path.is_file() and path.suffix in {".gradle", ".kts"}:
                  original = path.read_text()
                  updated = original.replace("mavenCentral()", mirror + "\n            mavenCentral()")
                  if updated != original:
                      path.write_text(updated)
                      changed += 1
          print(f"Added Google-hosted Maven Central mirror to {changed} Gradle file(s); Maven Central remains as fallback.")
          PY
      - name: Generate application icons
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo tauri android build --apk --target aarch64; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((60 * attempt))
              echo "Android build failed (attempt $attempt/3); retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "::error::Android build failed after 3 attempts."
          exit 1
      - name: Sign Android APK with permanent release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/nexus-release.keystore"
          ALIGNED_APK="$RUNNER_TEMP/nexus-aligned.apk"
          SIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/Nexus-0.1.1-android-arm64.apk"
          mkdir -p "$(dirname "$SIGNED_APK")"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name 'app-universal-release-unsigned.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Android APK not found."
            find src-tauri/gen/android/app/build/outputs/apk -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          echo "Signed APK: $SIGNED_APK"
          rm -f "$KEYSTORE" "$ALIGNED_APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/Nexus-0.1.1-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
